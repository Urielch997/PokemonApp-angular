<div class="card-container" (click)="togglePokemon(id())">
    <div class="poke-card" [class.selected-bg]="isSelected()">
        <div class="poke-image">
            <img src={{img()}} [alt]="name()"/>
        </div>
        <div class="poke-name">
            <span class="poke-number">#{{ id() }}</span>
            <span class="poke-name-text">{{name()}}</span>
        </div>
    </div>
</div>
